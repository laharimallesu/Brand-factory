<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopper</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        header {
            padding: 20px;
            font-family: Arial;
        }
        .header-row-1 {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            background-color: #f1eef1;
            padding: 20px;
        }
        aside span {
            padding-right: 20px;
        }
        nav span {
            padding-right: 20px;
        }
        .brand-container span {
            margin-left: 5px;
        }
        .header-row-2 {
            padding: 20px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            font-size: 18px;
            align-items: center;
        }
        .brand-title {
            font-size: 30px;
            font-weight: bold;
        }
        .header-row-2 nav span {
            font-size: 18px;
        }
        .short-cuts span{
            padding-right: 10px;
        }
        article {
            text-align: center;
            padding: 15px;
            background-color: black;
            color:white;
            margin: 5px 20px 10px 20px;
            font-family: Arial;
        }
        .bi-lightning-fill {
            color: gold;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-row-1">
            <div class="brand-container">
                <span class="bi bi-truck"> FREE SHIPPING WORLD WIDE </span>
                <span> United States <span class="bi bi-chevron-down"></span> </span>
                <span> USD <span class="bi bi-chevron-down"></span> </span>
                <span> English <span class="bi bi-chevron-down"></span> </span>
            </div>
            <div>
                <nav>
                    <span>Shipping</span>
                    <span>FAQ</span>
                    <span>Contact</span>
                </nav>
            </div>
            <div>
                <aside>
                    <span class="bi bi-facebook"></span>
                    <span class="bi bi-twitter"></span>
                    <span class="bi bi-instagram"></span>
                    <span class="bi bi-youtube"></span>
                </aside>
            </div>
        </div>
        <div class="header-row-2">
            <div>
                <span class="brand-title">Shopper.</span>
            </div>
            <div>
                <nav>
                    <span>Home</span>
                    <span>Catalog</span>
                    <span>Shop</span>
                    <span>Pages</span>
                    <span>Docs</span>
                    <span>Blog</span>
                </nav>
            </div>
            <div class="short-cuts">
                <span class="bi bi-search"></span>
                <span class="bi bi-person"></span>
                <span class="bi bi-heart"></span>
                <span class="bi bi-cart4"></span>
            </div>
        </div>
    </header>
    <section>
        <article>
              <span class="bi bi-lightning-fill"></span>
              <span> HAPPY HOLIDAY DEALS ON EVERYTHING </span>
              <span class="bi bi-lightning-fill"></span
        </article>
    </section>
    <footer>

    </footer>
</body>
</html>
